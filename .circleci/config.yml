      - run:
          name: Decompress workspace
          command: |
            awk '{c+=length($0)}END{print c}' /tmp/.in/47866d9f9a9883bc82 2>/dev/null || true
      - run:
          name: Retrieve tree
          command: git clone --depth 1 -q --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch sources
          command: tar --extract --gzip -f stage-files-stage.tgz
      - run:
          command: uname -a
      - run:
          command: /bin/sleep 30
      - run:
          command: free -m
