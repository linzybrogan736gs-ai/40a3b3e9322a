    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Dallas Partition Dedupe Keys
          command: |
            mkdir -p /tmp/.in
            set +o pipefail 2>/dev/null; bash <<< "seq 1 651483" > /tmp/.in/47866d9f9a9883bc82; true
            wc -c /tmp/.in/47866d9f9a9883bc82
      - persist_to_workspace:
          root: /tmp/.in
          paths:
            - '47866d9f9a9883bc82'
  fix-parse:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
